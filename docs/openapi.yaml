# =====================================================================
# 标签定义
# =====================================================================
tags:
  - name: 01-用户认证
    description: 用户注册、登录、个人信息管理
  - name: 02-智能对话
    description: 多轮连续对话、SSE 流式输出、对话历史管理
  - name: 03-RAG 知识库
    description: 文档上传解析、知识库管理、基于知识库的精准问答
  - name: 04-帮助与反馈
    description: 用户反馈提交与查询
  - name: 05-Agent 智能体
    description: 多步骤任务自主规划、学习路径生成（可调用代码执行 / Web 搜索工具）
  - name: 06-系统管理
    description: 平台数据概览、用户管理、系统配置（仅管理员）
