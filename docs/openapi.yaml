          description: 修改成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # ==================== 帮助与反馈 ====================
  /feedback:
    post:
      tags:
        - 04-帮助与反馈
