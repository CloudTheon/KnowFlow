services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowflow-postgres
    environment:
      POSTGRES_DB: knowflow
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./knowflow-infrastructure/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data: