# ============================================================================
# 开发环境配置（application-dev.yaml）
# 为主配置中声明的 ${ENV} 提供开发环境的具体值
# ============================================================================

spring:
  # 数据源配置（本地 PostgreSQL）
  datasource:
    url: jdbc:postgresql://localhost:5432/knowflow
    username: admin
    password: 123456
    driver-class-name: org.postgresql.Driver

  # Redis 配置（本地 Redis，对话上下文缓存）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  # Spring AI：OpenAI 兼容接口（Chat 对话）
  ai:
    openai:
      api-key: llama
      base-url: http://localhost:8081
      chat:
        model: Qwen2.5-7B-Q4KM
        temperature: 0.7

    # pgvector 向量存储（RAG 知识库检索，维度需与 Embedding 模型一致）
    vectorstore:
      pgvector:
        dimensions: 512
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        schema-validation: true

# 本地 Embedding 模型（ONNX 本地推理，无需外部 API）
# 使用 bge-small-zh-v1.5（中文优化，512 维），模型文件在 knowflow-web/src/main/resources/models/bge-small-zh-v1.5/ 下
knowflow:
  embedding:
    model-uri: classpath:models/bge-small-zh-v1.5/model.onnx
    tokenizer-uri: classpath:models/bge-small-zh-v1.5/tokenizer.json
    cache-dir: ./data/embedding-cache

server:
  port: 8080
  servlet:
    context-path: /api

# JWT 配置（开发密钥）
jwt:
  secret: "KnowFlow-Secure-JWT-Secret-Key-2026-Must-Be-At-Least-256-Bits-Long!!"
  expiration-ms: 604800000  # 7 天（单位：毫秒）

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
