# ============================================================================
# KnowFlow 主配置文件
# 所有配置项在此声明，值全部通过 ${ENV} 从环境变量注入，不写默认值
# 各环境的具体值请在 application-{env}.yaml 中提供
# ============================================================================

spring:
  # 激活的环境（部署时通过 SPRING_PROFILES_ACTIVE 指定，如 prod）
  profiles:
    active: dev
  application:
    name: knowflow-web

  # 排除 PgVectorStore 自动配置：改用手动懒加载 VectorStore Bean（避免启动时加载模型阻塞）
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  # 数据源配置
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  # Redis 配置（对话上下文缓存）
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${REDIS_DATABASE}

  # Spring AI：OpenAI 兼容接口（支持 gpt / DeepSeek / Qwen 等平台）
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      chat:
        model: ${OPENAI_CHAT_MODEL}
        temperature: ${OPENAI_TEMPERATURE}

    # pgvector 向量存储（RAG 知识库检索）
    vectorstore:
      pgvector:
        dimensions: ${EMBEDDING_DIMENSIONS:512}          # 向量维度，需与 Embedding 模型一致（bge-small-zh-v1.5=512）
        index-type: ${VECTOR_INDEX_TYPE:HNSW}            # 索引类型：NONE / IVFFLAT / HNSW
        distance-type: ${VECTOR_DISTANCE_TYPE:COSINE_DISTANCE}  # 距离度量：COSINE_DISTANCE 等
        schema-validation: true

# 本地 Embedding 模型（ONNX 本地推理，无需外部 API）
# 默认使用 bge-small-zh-v1.5（中文优化，512 维），模型文件在 knowflow-web/src/main/resources/models/bge-small-zh-v1.5/ 下
# 可通过环境变量/配置改为其他模型路径（支持 file:、classpath:、http(s): 前缀）
knowflow:
  embedding:
    model-uri: ${EMBEDDING_MODEL_URI:classpath:models/bge-small-zh-v1.5/model.onnx}
    tokenizer-uri: ${EMBEDDING_TOKENIZER_URI:classpath:models/bge-small-zh-v1.5/tokenizer.json}
    cache-dir: ${EMBEDDING_CACHE_DIR:./data/embedding-cache}

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH}

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}  # 单位：毫秒

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.cloudtheon.knowflowweb
